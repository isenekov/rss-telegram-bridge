
name: RSS to Telegram Bridge


on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-telegram-bridge
  cancel-in-progress: false

jobs:
  rss-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS and reserve new articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --prepare

      - name: Save reservations before sending (retry transient GitHub errors)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f posted.json

          if git diff --cached --quiet; then
            echo "No new RSS articles. No reservation commit needed."
            exit 0
          fi

          git commit -m "Reserve RSS articles before Telegram delivery"

          for attempt in 1 2 3 4 5; do
            echo "Saving reservation to GitHub: attempt ${attempt}/5"
            if git push origin HEAD:main; then
              echo "Article IDs saved. Safe to publish to Telegram."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Could not save article IDs to GitHub. Telegram delivery is blocked to prevent duplicates."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Publish only after successful reservation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --publish
